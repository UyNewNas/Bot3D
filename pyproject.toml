[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bot3d-kernel"
version = "0.1.0"
description = "Technology-independent robot coordination kernel foundations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
  "t26_package: installed package and minimal distribution checks",
  "t26_imports: core dependency boundaries and their negative controls",
  "t26_ports_clock: ordinary domain time values, clock port, and deterministic clocks",
]

[tool.uv]
required-version = "==0.10.9"
