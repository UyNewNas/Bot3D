[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bot3d-kernel"
version = "0.1.0"
description = "Technology-independent robot coordination kernel foundations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
  "t02_digest: normalized command identity and equivalent execution semantics",
  "t03_conflict: every execution field and invalid command inputs",
  "t02_journal: atomic command history, retries and ordered facts",
  "t18_journal_fault: journal storage uncertainty and failed writes",
  "t01_leases: scoped and exclusive control leases",
  "t07_authority_loss: immutable loss effects and unresolved execution holds",
  "t30_activation: evidence policy and explicit control activation",
  "t42_lease_clock: monotonic expiry and clock failure",
  "t26_package: installed package and minimal distribution checks",
  "t26_imports: core dependency boundaries and their negative controls",
  "t26_ports_clock: ordinary domain time values, clock port, and deterministic clocks",
  "t28_values: typed identifiers, finite values, units, and scoped goals",
  "t28_basis: framed rigid transforms, points, and basis directions",
  "t28_quaternion: quaternion representation, rotation, and validation",
  "t29_compose: pure effective pose-goal capability composition",
  "t29_revision: semantic revisions of capability snapshots",
  "t46_discovery: identity-consistent read-only robot discovery",
  "t46_readonly: read-only mock and observation validation",
]

[tool.uv]
required-version = "==0.10.9"
